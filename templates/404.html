<!doctype html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1,0">
    <title>{% block title %}SkyPro{% endblock %}</title>
    <link rel="stylesheet" type="text/css" href="/static/bootstrap.min.css">
</head>
<body>
<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">SkyPro education</h5>
</div>
<div class="container">
    <div class="container text-center mt-5">
        <h1 class="display-1">404</h1>
        <h2 class="mb-4">Страница не найдена</h2>

        <p class="lead mb-4">
            Кажется, здесь ничего нет. Возможно, вы ошиблись адресом или страница была удалена.
        </p>
        <!-- Навигация для всех -->
        <div class="mt-4 mb-5">
            <a href="{% url 'index' %}" class="btn btn-primary btn-lg me-2">Вернуться в магазин</a>
            <a href="{% url 'blog:index' %}" class="btn btn-outline-secondary btn-lg">Вернуться в блог</a>
        </div>
    </div>
</div>
<script src="/static/bootstrap.min.js"></script>
</body>
</html>
