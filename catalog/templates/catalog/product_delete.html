{% extends 'catalog/base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>Удаление товара из каталога: {{ product.name }}</h2>
    <p>Вы уверены, что хотите удалить этот товар?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'catalog:index' %}" class="btn btn-outline-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
