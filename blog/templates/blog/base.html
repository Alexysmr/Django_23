<!doctype html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1,0">
    <title>{% block title %}SkyPro{% endblock %}</title>
    <link rel="stylesheet" type="text/css" href="/static/bootstrap.min.css">
</head>
<body>
<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">SkyPro educational blog</h5>
    {% include 'blog/includes/menu.html' %}
</div>
<div class="container">
    {% block content %}
    {% endblock %}
</div>
<footer class="pt-4 my-md-2 pt-md-2 border-top">
    <div class="container">
        SkyPro
        <small class="d-block mb-3 text-muted">&copy; 2026</small>
    </div>
</footer>
<script src="/static/bootstrap.min.js"></script>
</body>
</html>
