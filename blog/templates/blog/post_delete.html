{% extends 'blog/base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>Удаление поста: {{ post.title }}</h2>
    <p>Вы уверены, что хотите удалить этот пост?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'blog:details' post.pk %}" class="btn btn-outline-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
